<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Showcase Stage — Jonathan Maia</title>
<style>
  :root { --glow: #2aa868; --glow2: #34c77b; }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(130% 90% at 50% 10%, #12161d 0%, #0a0c10 55%, #05070a 100%);
    color: #e9eef3; font-family: 'Segoe UI', system-ui, Roboto, sans-serif; overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage::after {
    content: ''; position: absolute; left: 50%; bottom: 8%; width: 80vmin; height: 26vmin;
    transform: translateX(-50%);
    background: radial-gradient(60% 100% at 50% 0%, color-mix(in srgb, var(--glow) 45%, transparent), transparent 70%);
    filter: blur(14px); opacity: .55; pointer-events: none;
  }
  .scene { position: relative; width: min(92vw, 560px); height: min(86vh, 760px); }

  .fx { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  .halo {
    width: 62%; aspect-ratio: 1; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, color-mix(in srgb, var(--glow) 70%, transparent), transparent 60%);
    filter: blur(2px); opacity: .5; animation: spin 14s linear infinite;
  }
  .rays {
    position: absolute; width: 150%; aspect-ratio: 1;
    background: repeating-conic-gradient(from 0deg, transparent 0 7deg, color-mix(in srgb, var(--glow) 16%, transparent) 7deg 9deg);
    mask: radial-gradient(circle, black 0, black 20%, transparent 62%);
    -webkit-mask: radial-gradient(circle, black 0, black 20%, transparent 62%);
    opacity: .5; animation: spin 40s linear infinite reverse;
  }
  .glow {
    width: 75%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--glow) 50%, transparent) 0%, transparent 62%);
    filter: blur(24px); animation: pulse 4.5s ease-in-out infinite;
  }
  .parts { position: absolute; inset: 0; overflow: hidden; }
  .parts i {
    position: absolute; bottom: -6px; border-radius: 50%;
    background: color-mix(in srgb, var(--glow2) 90%, white); box-shadow: 0 0 8px var(--glow);
    animation: rise linear infinite;
  }

  .figure {
    position: relative; z-index: 3; width: 74%; margin: 6% auto 0; aspect-ratio: 4/5;
    border-radius: 24px; overflow: hidden;
    background: linear-gradient(160deg, #1b2129, #0d1116);
    border: 1px solid color-mix(in srgb, var(--glow) 40%, #2a333d);
    box-shadow: 0 0 0 1px rgba(255,255,255,.03), 0 24px 60px rgba(0,0,0,.6),
                0 0 60px color-mix(in srgb, var(--glow) 35%, transparent);
    animation: float 6s ease-in-out infinite;
  }
  .figure canvas { width: 100% !important; height: 100% !important; display: block; }
  .figure::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.10), transparent 28%); pointer-events: none;
  }

  .pedestal {
    position: relative; z-index: 2; width: 78%; margin: -6% auto 0; height: 7%;
    background: radial-gradient(60% 120% at 50% 0%, #2a333d, #0c0f14 75%); border-radius: 50%;
    box-shadow: 0 0 40px color-mix(in srgb, var(--glow) 25%, transparent);
  }

  .plate { position: relative; z-index: 3; text-align: center; margin-top: 3%; }
  .plate .name {
    font-size: clamp(22px, 5vmin, 40px); font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
    background: linear-gradient(180deg, #fff, color-mix(in srgb, var(--glow) 55%, #9fb0bd));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .plate .concept { color: #9fb0bd; font-size: clamp(12px, 2.4vmin, 15px); margin-top: 4px; }
  .plate .stack { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .plate .stack span {
    font-size: clamp(10px, 2vmin, 13px); font-weight: 700; letter-spacing: .5px; padding: 4px 11px; border-radius: 20px;
    color: color-mix(in srgb, var(--glow) 70%, white); background: color-mix(in srgb, var(--glow) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--glow) 45%, transparent);
  }
  .plate .role { margin-top: 10px; font-size: 11px; letter-spacing: 3px; color: #5b6774; text-transform: uppercase; }

  .nav { position: fixed; top: 50%; transform: translateY(-50%); z-index: 9; cursor: pointer;
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12); color: #cfd8e0; font-size: 22px;
    transition: .2s; user-select: none; }
  .nav:hover { background: color-mix(in srgb, var(--glow) 25%, transparent); border-color: var(--glow); }
  #prev { left: 20px; } #next { right: 20px; }
  .dots { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 9; }
  .dots b { width: 9px; height: 9px; border-radius: 50%; background: #2a333d; cursor: pointer; transition: .2s; }
  .dots b.on { background: var(--glow); box-shadow: 0 0 10px var(--glow); width: 26px; border-radius: 6px; }
  .brand { position: fixed; top: 18px; left: 22px; z-index: 9; font-weight: 800; letter-spacing: 1px; color: #cfd8e0; }
  .brand small { display: block; font-weight: 500; color: #5b6774; letter-spacing: .5px; }
  .fade { animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { opacity: .4; transform: scale(.96); } 50% { opacity: .75; transform: scale(1.04); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes rise { from { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } to { transform: translateY(-78vmin); opacity: 0; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "/web/three.module.js",
    "three/examples/jsm/loaders/GLTFLoader.js": "/web/loaders/GLTFLoader.js",
    "three/examples/jsm/loaders/RGBELoader.js": "/web/loaders/RGBELoader.js",
    "three/examples/jsm/utils/BufferGeometryUtils.js": "/web/utils/BufferGeometryUtils.js"
  }
}
</script>
</head>
<body>
  <div class="brand">JONATHAN MAIA<small>Mobile · Showcase Stage</small></div>
  <div id="stage">
    <div class="scene">
      <div class="fx"><div class="rays"></div><div class="glow"></div><div class="halo"></div></div>
      <div class="parts" id="parts"></div>
      <div id="card">
        <div class="figure"><canvas id="hero"></canvas></div>
        <div class="pedestal"></div>
        <div class="plate">
          <div class="name" id="name"></div>
          <div class="concept" id="concept"></div>
          <div class="stack" id="stack"></div>
          <div class="role">Stack aplicada · 3D ao vivo</div>
        </div>
      </div>
    </div>
  </div>
  <div class="nav" id="prev">‹</div>
  <div class="nav" id="next">›</div>
  <div class="dots" id="dots"></div>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
  import { RGBELoader } from 'three/examples/jsm/loaders/RGBELoader.js';

  // modelos reais CC0/CC-BY (Poly Pizza), exportados do Blender para GLB limpo
  const figures = [
    { name: 'ML Kit Vision', model: '/models/hero-camera.glb', glow: 0x2aa868,
      concept: 'Reconhecimento on-device: QR, rosto e texto', stack: ['Jetpack Compose', 'CameraX', 'ML Kit'] },
    { name: 'Offline-first Sync', model: '/models/hero-phone.glb', glow: 0x3b82f6,
      concept: 'Fila idempotente, sync em lote, sem redundância', stack: ['Room', 'Coroutines', 'MVVM'] },
    { name: 'Viver Melhor 3D', model: '/models/hero-building.glb', glow: 0x14b8a6,
      concept: 'Tour 3D + AR de chegada ao condomínio', stack: ['Three.js', 'WebXR', 'glTF', 'Blender'] },
    { name: 'VaultCam', model: '/models/hero-vaultcam.glb', glow: 0x8b5cf6, fit: 3.3,
      concept: '3 devices testemunham a cena: evidência descentralizada', stack: ['Compose', 'CameraX', 'Solana', 'LiveKit'] },
  ];
  let i = 0;
  const $ = (id) => document.getElementById(id);
  const hex = (n) => '#' + n.toString(16).padStart(6, '0');

  // ---- three ----
  const canvas = $('hero');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  camera.position.set(0, 0.7, 6.4);
  camera.lookAt(0, 0, 0);

  // HDRI real de estúdio cinematográfico (Poly Haven, CC0) → reflexos e luz de verdade
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  new RGBELoader().load('/hdr/ferndale_studio_10_1k.hdr', (hdr) => {
    hdr.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = pmrem.fromEquirectangular(hdr).texture;
    hdr.dispose();
  });

  const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(3, 5, 4); scene.add(key);
  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x20242c, 0.6));
  const accent = new THREE.PointLight(0xffffff, 60, 25); accent.position.set(-3, 1.8, 3); scene.add(accent);
  const rim = new THREE.PointLight(0xffffff, 30, 25); rim.position.set(2.5, -1, -3); scene.add(rim);

  const loader = new GLTFLoader();
  const cache = {};
  let hero = null;

  function fitModel(obj, target) {
    const box = new THREE.Box3().setFromObject(obj);
    const size = box.getSize(new THREE.Vector3());
    const s = (target || 2.4) / Math.max(size.x, size.y, size.z); // enquadra no palco com margem
    obj.scale.setScalar(s);
    const box2 = new THREE.Box3().setFromObject(obj);
    const c = box2.getCenter(new THREE.Vector3());
    obj.position.sub(c);
    obj.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
    const wrap = new THREE.Group(); wrap.add(obj); return wrap;
  }

  function setHero() {
    const f = figures[i];
    accent.color.set(f.glow);
    rim.color.set(f.glow);
    if (hero) { scene.remove(hero); hero = null; }
    const show = (g) => { if (figures[i].model !== f.model) return; if (hero) scene.remove(hero); hero = g; scene.add(hero); };
    if (cache[f.model]) { show(cache[f.model].clone(true)); return; }
    loader.load(f.model, (gltf) => {
      const wrap = fitModel(gltf.scene, f.fit);
      cache[f.model] = wrap;
      show(wrap.clone(true));
    });
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (w === 0 || h === 0) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    resize();
    if (hero) { hero.rotation.y += clock.getDelta() * 0.6; hero.rotation.x = -0.08; }
    renderer.render(scene, camera);
  });

  // ---- UI ----
  const parts = $('parts');
  for (let k = 0; k < 26; k++) {
    const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (5 + Math.random() * 6) + 's'; p.style.animationDelay = (-Math.random() * 8) + 's';
    const s = 2 + Math.random() * 4; p.style.width = p.style.height = s + 'px'; parts.appendChild(p);
  }
  const dots = $('dots');
  figures.forEach((_, k) => { const b = document.createElement('b'); b.onclick = () => go(k); dots.appendChild(b); });

  function render() {
    const f = figures[i];
    document.documentElement.style.setProperty('--glow', hex(f.glow));
    $('name').textContent = f.name;
    $('concept').textContent = f.concept;
    $('stack').innerHTML = f.stack.map((s) => `<span>${s}</span>`).join('');
    const card = $('card'); card.classList.remove('fade'); void card.offsetWidth; card.classList.add('fade');
    [...dots.children].forEach((b, k) => b.classList.toggle('on', k === i));
    setHero();
  }
  function go(k) { i = (k + figures.length) % figures.length; render(); }
  $('prev').onclick = () => go(i - 1);
  $('next').onclick = () => go(i + 1);
  addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') go(i - 1); if (e.key === 'ArrowRight') go(i + 1); });
  render();
</script>
</body>
</html>
